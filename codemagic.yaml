workflows:
  android-release:
    name: SRI News Android APK
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          rm -rf android
          flutter create --org com.srinews --project-name sri_news --platforms android .
          sed -i 's/android:label="[^"]*"/android:label="SRI NEWS"/' android/app/src/main/AndroidManifest.xml

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          sed -i 's/com\.srinews\.app/com.srinews.app/g' android/app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # flutter_local_notifications requires core library desugaring.
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              marker = "compileOptions {"
              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              else:
                  raise SystemExit("compileOptions block not found in generated build.gradle.kts")

          if "coreLibraryDesugaring(" not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
              else:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          p.write_text(s)
          PY

          echo "Application configuration:"
          grep -n "namespace\|applicationId\|isCoreLibraryDesugaringEnabled\|coreLibraryDesugaring" android/app/build.gradle.kts

      - name: Get Flutter packages
        script: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
